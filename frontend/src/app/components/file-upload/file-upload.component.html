<div class="upload-container">
  <div class="upload-zone"
       [class.dragging]="isDragging()"
       [class.uploading]="isUploading()"
       [class.analyzing]="isAnalyzing()"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)">

    <!-- Ghost hand animation -->
    <div class="ghost-hand" *ngIf="isDragging()">
      👻
    </div>

    <div class="upload-content" *ngIf="currentPhase() === 'idle'">
      <div class="upload-icon">🪦</div>
      <h3>Drop Your Dead Code Here</h3>
      <p>or click to browse</p>
      <p class="file-types">Supports: .vb, .as, .xaml, .cs, .csproj</p>
      <p class="file-limit">Max 5MB</p>

      <input type="file"
             #fileInput
             (change)="onFileSelect($event)"
             accept=".vb,.as,.xaml,.cs,.csproj,.vbproj,.frm,.bas,.cls"
             class="file-input">

      <button class="upload-button" (click)="fileInput.click()">
        Choose File
      </button>
    </div>

    <!-- Upload progress -->
    <div class="upload-progress" *ngIf="currentPhase() === 'uploading'">
      <div class="progress-icon">⚡</div>
      <p>Uploading to the graveyard...</p>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="uploadProgress()"></div>
      </div>
      <p class="progress-text">{{ uploadProgress() }}%</p>
    </div>

    <!-- Analysis progress -->
    <div class="analysis-progress" *ngIf="currentPhase() === 'analyzing'">
      <div class="analysis-icon">🔮</div>
      <p class="analysis-title">Analyzing with OpenAI...</p>
      <p class="analysis-subtitle">Reading the death certificate</p>
      <div class="analysis-spinner">
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring"></div>
      </div>
      <div class="analysis-steps">
        <div class="step active">📄 Detecting technology</div>
        <div class="step active">🧬 Analyzing code structure</div>
        <div class="step active">📊 Counting lines of code</div>
      </div>
    </div>
  </div>
</div>
